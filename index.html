<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1A2340">
<title>Midnight Restaurant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800;900&display=swap">
<style>
/* Midnight Restaurant (まよなか屋): a cozy two-player ramen stall on a rainy night.
   The Cook boils, ladles and tops the bowls; the Counter seats guests, hears their orders, pours tea, serves and wipes.
   Everything you see is drawn in code (layered 2D with depth); every sound is synthesized. No image or audio files are loaded. */
:root{ --cream:#FFF4E2; --cream2:#F6E6CC; --ink:#3B2618; --dim:#8A6E57; --mint:#5ED3B0; --red:#D8452F; --navy:#1A2340;
  --sl:env(safe-area-inset-left); --sr:env(safe-area-inset-right); --st:env(safe-area-inset-top); --sb:env(safe-area-inset-bottom);
  --ui:"M PLUS Rounded 1c",system-ui,sans-serif; }
:root[data-lang=zh]{ --ui:"M PLUS Rounded 1c","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif; }
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--navy);color:var(--ink);font-family:var(--ui);overflow:hidden;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
button,input{touch-action:manipulation;font-family:inherit}
[hidden]{display:none!important}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;inset:0;pointer-events:none;z-index:3}
.chip{position:absolute;display:inline-flex;align-items:center;gap:7px;background:var(--cream);color:var(--ink);border-radius:999px;padding:6px 14px 6px 10px;font:900 13px var(--ui);letter-spacing:.06em;box-shadow:0 3px 10px rgba(20,10,4,.35)}
.chip svg{width:20px;height:20px}
#role{left:max(10px,var(--sl));top:calc(var(--st) + 8px)}
#yen{right:max(10px,var(--sr));top:calc(var(--st) + 8px)}
#yen b{font-weight:900;font-size:15px}
#prog{left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 6px);font-size:11px;padding:4px 12px;opacity:.92}
#prog i{display:inline-block;width:9px;height:9px;border-radius:50%;background:rgba(59,38,24,.18);margin:0 2px;vertical-align:-1px}
#prog i.on{background:var(--mint)} #prog i.now{background:#FFB23E}
#hint{left:50%;top:calc(var(--st) + 8px);transform:translateX(-50%);max-width:min(520px,calc(100vw - 340px));padding:7px 16px;font:800 14px/1.35 var(--ui);text-align:center;white-space:normal;justify-content:center;
  background:#F2FFF9;box-shadow:0 0 0 2px var(--mint),0 4px 14px rgba(20,10,4,.35)}
#hint.pop{animation:pop .35s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{from{transform:translateX(-50%) scale(.7);opacity:0}}
#status{right:max(10px,var(--sr));top:calc(var(--st) + 46px);font-size:11px;font-weight:800;opacity:.92}
/* the cook's ticket rail and the counter's order cards */
.tix{position:absolute;right:max(10px,var(--sr));top:calc(var(--st) + 78px);display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.tk{position:relative;background:#FFFDF6;border-radius:6px;padding:6px 10px 6px 8px;box-shadow:0 3px 8px rgba(20,10,4,.35);display:flex;align-items:center;gap:7px;font:900 15px var(--ui);min-width:96px;transform:rotate(-1.5deg)}
.tk::before{content:"";position:absolute;left:50%;top:-6px;width:22px;height:8px;margin-left:-11px;border-radius:3px;background:#B8B0A2}
.tk img{width:30px;height:30px}
.tk .q{font-size:24px;color:var(--dim);width:30px;text-align:center}
.tk small{display:block;font:800 9.5px var(--ui);color:var(--dim)}
.tk.done{opacity:.55}
.tk .stamp{position:absolute;right:-6px;top:-8px;width:28px;height:28px;border-radius:50%;border:3px solid var(--red);color:var(--red);font:900 14px/22px var(--ui);text-align:center;background:rgba(255,253,246,.9);transform:rotate(-14deg)}
.ord{position:absolute;transform:translate(-50%,-100%);background:var(--cream);border-radius:12px;padding:5px 6px 5px 8px;box-shadow:0 4px 14px rgba(20,10,4,.4);pointer-events:auto;display:flex;align-items:center;gap:8px}
.ord .ws{display:flex;flex-direction:column}
.ord::after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-8px;border:8px solid transparent;border-top-color:var(--cream);border-bottom:0}
.ord .w{display:flex;align-items:center;gap:6px;margin:1px 0}
.ord .w img{width:26px;height:26px}
.ord .w b{display:block;font:900 17px/1.05 var(--ui)}
.ord .w small{display:block;font:800 9.5px var(--ui);color:var(--dim)}
.ord .say{font:800 10px var(--ui);color:#2C8F72;margin-top:2px}
.ord button{flex:none;border:0;border-radius:10px;background:var(--mint);color:#0E3B2E;font:900 12px var(--ui);padding:9px 10px;cursor:pointer;white-space:nowrap}
.ord button.sent{background:#E7DCCB;color:var(--dim)}
.ord .why{font:800 10.5px var(--ui);color:var(--red);margin-top:2px}
.ord .reveal{padding:2px 7px;font-size:11px;background:#E7DCCB;color:var(--ink)}
.newword{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);background:var(--cream);border-radius:18px;padding:12px 18px;box-shadow:0 0 0 3px var(--mint),0 10px 30px rgba(10,5,2,.5);text-align:center;animation:pop2 .4s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop2{from{transform:translate(-50%,-50%) scale(.6);opacity:0}}
.newword .k{font:900 11px var(--ui);letter-spacing:.24em;color:#2C8F72}
.newword img{width:64px;height:64px;display:block;margin:4px auto}
.newword b{display:block;font:900 32px/1.1 var(--ui)}
.newword small{display:block;font:800 13px var(--ui);color:var(--dim)}
/* menus */
.ui{position:fixed;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;padding:12px max(16px,var(--sl));background:rgba(16,20,40,.55)}
.panel{background:var(--cream);border-radius:22px;box-shadow:0 14px 40px rgba(10,5,2,.55);padding:16px 20px;width:min(620px,100%);max-height:100%;overflow:auto}
.kicker{font:900 11px var(--ui);letter-spacing:.3em;color:#2C8F72;text-transform:uppercase}
h1{margin:4px 0 0;font:900 34px/1.1 var(--ui);color:var(--ink)}
h1 small{font-size:16px;color:var(--dim);margin-left:8px}
h2{margin:4px 0 6px;font:900 24px/1.2 var(--ui)}
.lead{margin:8px 0 10px;font:500 13.5px/1.6 var(--ui);color:#5A4232}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:10px}
.btn{font:900 14px var(--ui);color:var(--cream);background:var(--red);border:0;border-radius:12px;padding:11px 18px;cursor:pointer;box-shadow:0 3px 0 #9C2E1E}
.btn.mint{background:var(--mint);color:#0E3B2E;box-shadow:0 3px 0 #2C8F72}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px rgba(59,38,24,.25)}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn:disabled{opacity:.5}
input.codein{font:900 20px var(--ui);letter-spacing:.2em;text-transform:uppercase;width:120px;padding:9px 12px;border-radius:12px;border:0;background:#fff;box-shadow:inset 0 0 0 2px rgba(59,38,24,.2);color:var(--ink);-webkit-user-select:text;user-select:text}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.role{all:unset;cursor:pointer;display:block;padding:12px 14px;border-radius:16px;background:#fff;box-shadow:inset 0 0 0 2px rgba(59,38,24,.12)}
.role:active{background:#F2FFF9}
.role b{display:flex;align-items:center;gap:8px;font:900 18px var(--ui)}
.role b svg{width:26px;height:26px}
.role small{display:block;margin-top:6px;font:500 12px/1.5 var(--ui);color:#6A5242}
.steps{margin:6px 0 0;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:9px;align-items:baseline;font:800 13px/1.45 var(--ui);color:#4A3424;margin:3px 0}
.steps li::before{content:counter(s);flex:none;width:20px;height:20px;border-radius:50%;background:var(--mint);color:#0E3B2E;font:900 11px/20px var(--ui);text-align:center}
.note{font:500 12px/1.55 var(--ui);color:var(--dim);margin-top:8px}
.err{color:var(--red);font-weight:900}
.code{font:900 44px var(--ui);letter-spacing:.24em;color:var(--red);line-height:1.1}
.link{font:700 11.5px var(--ui);color:var(--dim);background:#fff;border-radius:10px;padding:7px 10px;word-break:break-all;-webkit-user-select:text;user-select:text}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stats span{display:flex;flex-direction:column;padding:8px 10px;border-radius:12px;background:#fff;font:800 10px var(--ui);letter-spacing:.12em;color:var(--dim);text-transform:uppercase}
.stats b{font:900 22px var(--ui);color:var(--ink);letter-spacing:0}
.words{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.words span{display:flex;align-items:center;gap:6px;background:#fff;border-radius:12px;padding:5px 10px 5px 6px;font:900 16px var(--ui)}
.words img{width:30px;height:30px}
.words small{font:800 10px var(--ui);color:var(--dim)}
.stars{font:900 26px var(--ui);color:#FFB23E;letter-spacing:.1em}
.stars .off{color:rgba(59,38,24,.15)}
.lang{position:fixed;right:max(12px,var(--sr));top:calc(var(--st) + 10px);z-index:10;font:900 12px var(--ui);color:var(--ink);background:var(--cream);border:0;border-radius:999px;padding:6px 12px;box-shadow:0 3px 10px rgba(10,5,2,.4);cursor:pointer}
.lang em{font-style:normal;color:var(--dim)}
.ov{position:fixed;inset:0;z-index:12;display:flex;align-items:center;justify-content:center;background:rgba(16,20,40,.7);text-align:center;color:var(--cream);font:900 18px var(--ui)}
.ov .n{font:900 90px var(--ui);color:var(--cream)}
.spin{display:inline-block;width:14px;height:14px;border-radius:50%;border:3px solid var(--mint);border-right-color:transparent;animation:rot .8s linear infinite;vertical-align:-2px;margin-right:8px}
@keyframes rot{to{transform:rotate(360deg)}}
.rotate{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:var(--navy);color:var(--cream);font:900 16px var(--ui);text-align:center;padding:20px}
@media (orientation:portrait) and (max-width:820px){ .rotate{display:flex} }
@media (max-height:400px){ .panel{padding:12px 16px} h1{font-size:28px} .lead{font-size:12.5px;margin:6px 0} }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="hud" id="hud" hidden>
  <div class="chip" id="role"></div>
  <div class="chip" id="yen"></div>
  <div class="chip" id="hint" hidden></div>
  <div class="chip" id="status" hidden></div>
  <div class="chip" id="prog"></div>
  <div class="tix" id="tix"></div>
  <div id="cards"></div>
  <div id="nw"></div>
</div>
<div class="ui" id="ui"><div class="panel" id="panel"></div></div>
<button class="lang" id="langBtn" hidden></button>
<div class="ov" id="ov" hidden></div>
<div class="rotate" id="rot">横にしてね</div>
<script src="vendor/peerjs.min.js"></script>
<script src="link.js"></script>
<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const TAU=Math.PI*2, rnd=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.floor(Math.random()*a.length)], clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
// inside 夜ふかし (the hub page) the hub holds the connection, the seats and the language
const HUB=(()=>{ try{ const h=window.parent!==window && window.parent.HUBAPI; return h && h.v ? h : null; }catch(e){ return null; } })();
const store={ get(k,d){ try{ const v=localStorage.getItem('mres_'+k); return v==null?d:JSON.parse(v); }catch(e){ return d; } }, set(k,v){ try{ localStorage.setItem('mres_'+k, JSON.stringify(v)); }catch(e){} } };
let LANG=HUB ? HUB.lang : (()=>{ try{ const v=JSON.parse(localStorage.getItem('yofu_lang')); if(v==='zh'||v==='en') return v; }catch(e){} return /^zh/i.test(navigator.language||'')?'zh':'en'; })();
const T=(en,zh)=>LANG==='zh'?zh:en;
document.documentElement.dataset.lang=LANG;

// ---------- the words, the guests, the nights ----------
const WORDS={ tamago:{k:'たまご', ro:'tamago', m:['egg','鸡蛋']}, negi:{k:'ねぎ', ro:'negi', m:['spring onion','葱花']}, naruto:{k:'なると', ro:'naruto', m:['fish-cake swirl','鱼板']} };
const mean=w=>T(WORDS[w].m[0], WORDS[w].m[1]);
const LOOKS={ haru:{nm:'ハル', skin:'#F6CBA4', hair:'#4A2A1C', style:'pony', coat:'#C8463A'}, ken:{nm:'ケン', skin:'#EFC09A', hair:'#2B2420', style:'cap', coat:'#5E7B4C'},
  mika:{nm:'ミカ', skin:'#F3C9A8', hair:'#3A2A22', style:'bob', coat:'#E0A93A'}, sora:{nm:'ソラ', skin:'#E9B98F', hair:'#1F2430', style:'spiky', coat:'#3E6EA8'},
  yuki:{nm:'ユキ', skin:'#F7D1B0', hair:'#5A3A2A', style:'long', coat:'#7E5BA6'} };
for(const k in LOOKS) LOOKS[k].id=k;
// where each painted guest's blank face sits, as fractions of the picture: x = centre, t = top (under the bangs), w = width.
// Measured by tests/mr_art_import.js; the game draws the dot eyes there.
const FACE={ haru:{x:.47,t:.452,w:.37}, ken:{x:.486,t:.414,w:.399}, mika:{x:.485,t:.369,w:.375}, sora:{x:.487,t:.395,w:.404}, yuki:{x:.484,t:.344,w:.374} };
// teach 2: every step is shown; 1: a hint after a few idle seconds; 0: only if you are stuck for a while
const NIGHTS=[
  {n:1, name:['First night','第一晚'], seats:1, gentle:true, words:['tamago'], guests:[{who:'haru',o:['tamago'],teach:2},{who:'ken',o:['tamago'],teach:1},{who:'mika',o:['negi'],teach:1,nw:'negi'}]},
  {n:2, name:['A busier night','更忙的一晚'], seats:2, gentle:false, words:['tamago','negi'], guests:[{who:'ken',o:['tamago','negi'],teach:0},{who:'sora',o:['naruto'],teach:1,nw:'naruto'},{who:'haru',o:['tamago'],teach:0},{who:'mika',o:['negi','naruto'],teach:0},{who:'yuki',o:['tamago','naruto'],teach:0},{who:'ken',o:['negi'],teach:0}]}];
// a word's romaji and meaning step back once you have served it right three times
let MASTER=store.get('mastery',{}); const known=w=>(MASTER[w]||0)>=3;
let BANK=store.get('bank',0);
const DECOR=[{id:'lanterns', at:1200, nm:['A string of lanterns','一串灯笼']},{id:'neko', at:3000, nm:['A lucky cat','招财猫']},{id:'ajisai', at:5200, nm:['A pot of hydrangeas','一盆绣球花']}];
const hasDecor=id=>BANK>=DECOR.find(d=>d.id===id).at;

// ---------- sound: synthesized, no files ----------
let AC=null, MG=null, NOISE=null, RAIN=null, BOIL=null;
function audio(){ try{ if(!AC){ AC=new (window.AudioContext||window.webkitAudioContext)(); MG=AC.createGain(); MG.gain.value=.85; MG.connect(AC.destination);
      const n=AC.sampleRate*2, b=AC.createBuffer(1,n,AC.sampleRate), d=b.getChannelData(0); for(let i=0;i<n;i++) d[i]=Math.random()*2-1; NOISE=b; loops(); }
    if(AC.state==='suspended') AC.resume(); }catch(e){} }
function nz(dur,o={}){ if(!AC) return; try{ const t=AC.currentTime+(o.at||0), s=AC.createBufferSource(), f=AC.createBiquadFilter(), g=AC.createGain(); s.buffer=NOISE; s.loop=true;
  f.type=o.type||'bandpass'; f.frequency.setValueAtTime(o.f||1000,t); if(o.f2) f.frequency.exponentialRampToValueAtTime(o.f2,t+dur); f.Q.value=o.q||1;
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(o.g||.2,t+(o.a||.005)); g.gain.exponentialRampToValueAtTime(.0001,t+dur); s.connect(f); f.connect(g); g.connect(MG); s.start(t,Math.random()*1.5); s.stop(t+dur+.05); }catch(e){} }
function tn(fr,dur,o={}){ if(!AC) return; try{ const t=AC.currentTime+(o.at||0), s=AC.createOscillator(), g=AC.createGain(); s.type=o.type||'sine'; s.frequency.setValueAtTime(fr,t); if(o.f2) s.frequency.exponentialRampToValueAtTime(o.f2,t+dur);
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(o.g||.1,t+(o.a||.005)); g.gain.exponentialRampToValueAtTime(.0001,t+dur); s.connect(g); g.connect(MG); s.start(t); s.stop(t+dur+.05); }catch(e){} }
function loops(){ try{ // rain on the awning, and the boiling pot (only the kitchen hears that one)
  const r=AC.createBufferSource(), hp=AC.createBiquadFilter(), lp=AC.createBiquadFilter(), rg=AC.createGain(); r.buffer=NOISE; r.loop=true; hp.type='highpass'; hp.frequency.value=500; lp.type='lowpass'; lp.frequency.value=3000; rg.gain.value=.05; r.connect(hp); hp.connect(lp); lp.connect(rg); rg.connect(MG); r.start(); RAIN=rg;
  const b=AC.createBufferSource(), bf=AC.createBiquadFilter(), bg=AC.createGain(); b.buffer=NOISE; b.loop=true; bf.type='lowpass'; bf.frequency.value=260; bg.gain.value=.0001; b.connect(bf); bf.connect(bg); bg.connect(MG); b.start(); BOIL=bg; }catch(e){} }
const SFX={
  plop(){ tn(240,.16,{f2:90,g:.2}); nz(.1,{type:'lowpass',f:900,g:.12}); }, splash(){ nz(.3,{type:'highpass',f:1500,g:.1}); },
  pour(){ nz(.3,{f:1400,f2:800,q:1.4,g:.07,a:.04}); }, land(){ tn(520,.07,{type:'triangle',g:.08}); nz(.05,{type:'lowpass',f:800,g:.12}); },
  clink(){ tn(2650,.25,{g:.05}); tn(3720,.18,{g:.03,at:.01}); }, slide(){ nz(.35,{f:700,f2:1600,q:.7,g:.1,a:.04}); tn(2200,.2,{g:.03,at:.3}); },
  bell(){ tn(1568,.8,{g:.07}); tn(2349,.6,{g:.035}); }, coins(){ [2600,3150,2900].forEach((f,i)=>tn(f,.22,{g:.05,at:i*.06})); },
  happy(){ tn(660,.12,{type:'triangle',g:.07}); tn(880,.16,{type:'triangle',g:.07,at:.08}); tn(1320,.22,{type:'triangle',g:.05,at:.16}); },
  hmm(){ tn(300,.16,{type:'triangle',g:.06,f2:240}); tn(240,.2,{type:'triangle',g:.05,at:.16,f2:200}); },
  grab(){ tn(440,.05,{type:'triangle',g:.04}); }, wipe(){ nz(.18,{f:1300,q:.7,g:.06,a:.03}); }, sparkle(){ [1760,2349,2793].forEach((f,i)=>tn(f,.3,{g:.03,at:i*.05})); },
  tick(){ tn(1100,.04,{type:'square',g:.03}); }, pop(){ tn(880,.08,{g:.05}); }, ding(){ tn(1318,.5,{g:.06}); tn(1975,.4,{g:.03,at:.05}); },
  open(){ [523,659,784].forEach((f,i)=>tn(f,.5,{type:'triangle',g:.06,at:i*.12})); }, close(){ [784,659,523,392].forEach((f,i)=>tn(f,.7,{type:'triangle',g:.06,at:i*.16})); } };
const buzz=ms=>{ try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){} };

// ---------- canvas: a 1000×460 stage scaled to the phone ----------
const VW=1000, VH=460, LIFT=18;
const cv=$('#cv'), ctx=cv.getContext('2d'); let W=0, H=0, DPR=1, S=1, OX=0, OY=0;
const LAYER={};
function resize(){ W=innerWidth; H=innerHeight; DPR=Math.min(2,devicePixelRatio||1); cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR); S=Math.min(W/VW,H/VH)*1.0; OX=(W-VW*S)/2; OY=(H-VH*S)/2; for(const k in LAYER) LAYER[k]=null; }
addEventListener('resize', ()=>{ resize(); if(HUB) applySafe(); }); resize();
const toV=e=>({x:(e.clientX-OX)/S, y:(e.clientY-OY)/S});
const toS=(x,y)=>({x:x*S+OX, y:y*S+OY});
let seed=7; const srand=()=>(seed=(seed*16807)%2147483647)/2147483647;
function mkLayer(draw){ const c=document.createElement('canvas'); c.width=Math.ceil(VW*S*DPR); c.height=Math.ceil(VH*S*DPR); const g=c.getContext('2d'); g.setTransform(S*DPR,0,0,S*DPR,0,0); seed=7; draw(g); return c; }
if(document.fonts) document.fonts.load('900 20px "M PLUS Rounded 1c"','たまごねぎなるとまよなか屋ラーメン').then(()=>{ for(const k in LAYER) LAYER[k]=null; }).catch(()=>{});
// the owner's painted art (art/*.webp); until a picture has loaded, the code-drawn version stands in
const ART={}, artReady=n=>!!(ART[n] && ART[n].complete && ART[n].naturalWidth);
for(const n of ['kitchen','counter',...Object.keys(LOOKS).map(k=>'guest-'+k)]){ const im=new Image(); im.onload=()=>{ for(const k in LAYER) LAYER[k]=null; }; im.src='art/'+n+'.webp'; ART[n]=im; }

// ---------- drawing: soft toy shapes ----------
function rr(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
function el(g,x,y,rx,ry){ g.beginPath(); g.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),0,0,TAU); }
function lg(g,x0,y0,x1,y1,stops){ const gr=g.createLinearGradient(x0,y0,x1,y1); stops.forEach(([o,c])=>gr.addColorStop(o,c)); return gr; }
function rg(g,x,y,r0,r1,stops){ const gr=g.createRadialGradient(x,y,r0,x,y,r1); stops.forEach(([o,c])=>gr.addColorStop(o,c)); return gr; }
function shadow(g,x,y,rx,ry,a=.28){ g.fillStyle=`rgba(40,18,8,${a})`; el(g,x,y,rx,ry); g.fill(); }
const SPR={};
function sprite(name,w,h,draw){ if(SPR[name]) return SPR[name]; const c=document.createElement('canvas'); c.width=w; c.height=h; draw(c.getContext('2d'),w,h); return SPR[name]=c; }
const glowSpr=col=>sprite('g'+col,128,128,(g)=>{ g.fillStyle=rg(g,64,64,0,64,[[0,col],[1,'rgba(0,0,0,0)']]); g.fillRect(0,0,128,128); });
const steamSpr=()=>sprite('steam',96,96,(g)=>{ g.fillStyle=rg(g,48,48,0,48,[[0,'rgba(255,255,255,.55)'],[1,'rgba(255,255,255,0)']]); g.fillRect(0,0,96,96); });
// the three toppings
function drawEgg(g,x,y,s,rot){ g.save(); g.translate(x,y); g.rotate(rot||0); g.scale(s,s);
  el(g,0,0,15,11); g.fillStyle=rg(g,-4,-4,2,16,[[0,'#FFFDF6'],[1,'#EAD9BE']]); g.fill(); g.strokeStyle='rgba(176,112,52,.55)'; g.lineWidth=2.2; g.stroke();
  el(g,1.5,.5,8.5,7); g.fillStyle=rg(g,0,-1,1,9,[[0,'#FFC23A'],[.6,'#F28A1E'],[1,'#D9621A']]); g.fill();
  el(g,-1.5,-2,3,2); g.fillStyle='rgba(255,255,255,.6)'; g.fill(); g.restore(); }
function drawNegi(g,x,y,s,seedN){ let sd=seedN||3; const r=()=>(sd=(sd*9301+49297)%233280)/233280;
  for(let i=0;i<7;i++){ const a=r()*TAU, d=r()*11*s, cx=x+Math.cos(a)*d, cy=y+Math.sin(a)*d*.6; el(g,cx,cy,3.6*s,3*s); g.fillStyle=i%3?'#6BB547':'#9AD16A'; g.fill(); el(g,cx,cy,1.6*s,1.3*s); g.fillStyle='#DDF2C2'; g.fill(); } }
function drawNaruto(g,x,y,s,rot){ g.save(); g.translate(x,y); g.rotate(rot||0); g.scale(s,s);
  g.beginPath(); for(let i=0;i<=48;i++){ const a=i/48*TAU, r=13+Math.sin(a*12)*1.1; g.lineTo(Math.cos(a)*r, Math.sin(a)*r*.82); } g.closePath(); g.fillStyle=rg(g,-3,-3,1,14,[[0,'#FFFFFF'],[1,'#EDE3DA']]); g.fill();
  g.strokeStyle='#F08AB0'; g.lineWidth=2.6; g.lineCap='round'; g.beginPath(); for(let i=0;i<=40;i++){ const a=i/40*TAU*1.7, r=1+i*.24; g.lineTo(Math.cos(a)*r, Math.sin(a)*r*.82); } g.stroke(); g.restore(); }
const TOP_DRAW={ tamago:(g,x,y,s)=>{ drawEgg(g,x-7*s,y,s*.95,-.15); drawEgg(g,x+9*s,y+3*s,s*.95,.2); }, negi:(g,x,y,s)=>drawNegi(g,x,y,s,5), naruto:(g,x,y,s)=>{ drawNaruto(g,x-5*s,y,s*.9,.2); drawNaruto(g,x+8*s,y+4*s,s*.9,-.3); } };

const DONE_COL={raw:'#F3E9CF', ready:'#F2C64E', soft:'#EED99A', soggy:'#EFE6C2'};
function noodleLines(g,x,y,rx,ry,s,n,col,lw){ g.strokeStyle='rgba(120,80,20,.3)'; g.lineWidth=lw+1.4*s; for(let pass=0;pass<2;pass++){ for(let i=0;i<n;i++){ const yy=y-ry*.45+i*ry*.16; g.beginPath(); for(let k=0;k<=12;k++){ const xx=x-rx*.7+k*rx*.117, w=Math.sin(k*1.3+i*2.1)*2.3*s; k?g.lineTo(xx,yy+w):g.moveTo(xx,yy+w); } g.stroke(); } g.strokeStyle=col; g.lineWidth=lw; } }
// a bowl from the counter: white, with the red stripes; b = {noodles, broth, tops}; eaten 0..1
function drawBowl(g,x,y,s,b,eaten=0){ const rx=58*s, ry=19*s, h=46*s;
  shadow(g,x,y+h-1*s,rx*.82,ry*.5,.32);
  g.save(); g.beginPath(); g.moveTo(x-rx,y); g.bezierCurveTo(x-rx*.95,y+h*.75,x-rx*.45,y+h,x,y+h); g.bezierCurveTo(x+rx*.45,y+h,x+rx*.95,y+h*.75,x+rx,y); g.closePath(); g.clip();
  g.fillStyle=lg(g,x-rx,0,x+rx,0,[[0,'#E2D6C6'],[.38,'#FFFCF6'],[1,'#D3C6B4']]); g.fillRect(x-rx,y-2,rx*2,h+4);
  g.fillStyle='#D2402F'; for(let i=-6;i<=6;i++){ const u=i/6.6, cx=x+Math.sin(u*1.4)*rx; el(g,cx,y+h*.62,rx*.045*(1-Math.abs(u)*.55),h*.5); g.fill(); }
  g.fillStyle='rgba(255,255,255,.35)'; el(g,x-rx*.45,y+h*.35,rx*.12,h*.3); g.fill(); g.restore();
  el(g,x,y,rx,ry); g.fillStyle='#FFF9F0'; g.fill(); el(g,x,y+1.5*s,rx*.9,ry*.8); g.fillStyle='#EADFCF'; g.fill();
  if(!b) return;
  const lv=clamp(b.broth||0,0,1.1)*(1-eaten*.85);
  g.save(); el(g,x,y+1.5*s,rx*.9,ry*.8); g.clip();
  if(lv>.02){ const sc=.55+.45*Math.min(1,lv), sy=y+(1-Math.min(1,lv))*ry*.55; g.fillStyle=rg(g,x-rx*.2,sy-2*s,2,rx,[[0,'#E4A453'],[1,'#9A5622']]); el(g,x,sy+1.5*s,rx*.9*sc,ry*.8*sc); g.fill();
    g.fillStyle='rgba(255,236,190,.4)'; [[-.5,-.2],[-.2,.3],[.3,-.35],[.55,.15],[.05,-.05]].forEach(([fx,fy])=>{ el(g,x+fx*rx*.75*sc,sy+fy*ry*.6*sc,2.4*s,1.3*s); g.fill(); }); }
  const n=Math.round(7*(1-eaten));
  if(b.noodles && n>0) noodleLines(g,x,y,rx,ry,s,n,DONE_COL[b.noodles]||DONE_COL.ready,(b.noodles==='soggy'?3.6:b.noodles==='soft'?3:2.4)*s);
  g.restore();
  if(eaten<.6) for(const t of b.tops||[]){ const p=TOP_POS[t]; TOP_DRAW[t](g,x+p[0]*rx,y+p[1]*ry,s); } }
const bowlTopAt=(x,y,s,t)=>{ const p=TOP_POS[t]; return {x:x+p[0]*58*s, y:y+p[1]*19*s}; };

  g.lineCap='round'; g.strokeStyle='#7A5236'; g.lineWidth=7; g.beginPath(); g.moveTo(x+18,y-8); g.lineTo(x+48,y-62); g.stroke(); g.strokeStyle='#A27750'; g.lineWidth=3; g.beginPath(); g.moveTo(x+20,y-12); g.lineTo(x+46,y-58); g.stroke();

    for(let i=-3;i<=3;i++){ g.beginPath(); g.moveTo(x+i*9,y); g.lineTo(x+i*4.5,y+40); g.stroke(); } for(let k=1;k<4;k++){ const yy=y+k*10, w=27-k*3; g.beginPath(); g.moveTo(x-w,yy); g.lineTo(x+w,yy); g.stroke(); }
    if(full){ g.save(); g.beginPath(); g.moveTo(x-25,y+1); g.lineTo(x-14,y+38); g.lineTo(x+14,y+38); g.lineTo(x+25,y+1); g.closePath(); g.clip(); g.strokeStyle=DONE_COL[done||'raw']; g.lineWidth=2.6;
      for(let i=0;i<6;i++){ g.beginPath(); for(let k=0;k<=8;k++){ const xx=x-24+k*6, yy=y+6+i*5+Math.sin(k*1.7+i)*2; k?g.lineTo(xx,yy):g.moveTo(xx,yy); } g.stroke(); } g.restore(); } }
  el(g,x,y,28,9); g.fillStyle=full?DONE_COL[done||'raw']:'rgba(40,46,52,.85)'; g.fill(); g.strokeStyle='#D9E0E6'; g.lineWidth=2.4; g.stroke(); }
function drawLadle(g,x,y){ g.lineCap='round'; g.strokeStyle='#9AA3AD'; g.lineWidth=4; g.beginPath(); g.moveTo(x+12,y-4); g.lineTo(x+46,y-56); g.stroke(); g.strokeStyle='#5E4030'; g.lineWidth=7; g.beginPath(); g.moveTo(x+40,y-46); g.lineTo(x+52,y-66); g.stroke();
  el(g,x,y,18,10); g.fillStyle=lg(g,x-18,0,x+18,0,[[0,'#8A939C'],[.5,'#DCE3E9'],[1,'#7E8790']]); g.fill(); el(g,x,y-1,14,6.5); g.fillStyle='#B06A2E'; g.fill(); }
function drawPotBody(g,x,y,rx,h,c1,c2){ g.beginPath(); g.moveTo(x-rx,y); g.lineTo(x-rx+4,y+h); g.quadraticCurveTo(x,y+h+16,x+rx-4,y+h); g.lineTo(x+rx,y); g.closePath();
  g.fillStyle=lg(g,x-rx,0,x+rx,0,[[0,c1],[.35,c2],[.6,'#9AA3AC'],[1,c1]]); g.fill(); }
function drawTeapot(g,x,y,tilt){ g.save(); g.translate(x,y); g.rotate(tilt||0);
  shadow(g,0,24,30,7,.25); g.beginPath(); g.moveTo(26,0); g.quadraticCurveTo(46,-6,52,-22); g.lineTo(44,-20); g.quadraticCurveTo(38,-8,24,-6); g.fillStyle='#E9E3D8'; g.fill();
  el(g,0,0,30,26); g.fillStyle=rg(g,-8,-10,2,34,[[0,'#FFFFFF'],[1,'#D9D2C6']]); g.fill();
  g.strokeStyle='#3E6EA8'; g.lineWidth=2.4; for(let k=0;k<3;k++){ g.beginPath(); for(let i=0;i<=10;i++){ const xx=-24+i*4.8, yy=4+k*7+Math.sin(i*1.4)*2; i?g.lineTo(xx,yy):g.moveTo(xx,yy); } g.stroke(); }
  el(g,0,-24,13,5); g.fillStyle='#D9D2C6'; g.fill(); el(g,0,-28,5,4); g.fillStyle='#3E6EA8'; g.fill();
  g.strokeStyle='#7A5236'; g.lineWidth=5; g.beginPath(); g.arc(0,-14,24,Math.PI*1.15,Math.PI*1.85); g.stroke(); g.restore(); }
function drawCup(g,x,y,lvl){ shadow(g,x,y+16,15,4,.22); g.beginPath(); g.moveTo(x-14,y-12); g.lineTo(x-11,y+14); g.quadraticCurveTo(x,y+18,x+11,y+14); g.lineTo(x+14,y-12); g.closePath(); g.fillStyle=lg(g,x-14,0,x+14,0,[[0,'#E6DED1'],[.4,'#FFFCF4'],[1,'#D8CFC1']]); g.fill();
  g.strokeStyle='#3E6EA8'; g.lineWidth=1.8; g.beginPath(); for(let i=0;i<=6;i++){ const xx=x-12+i*4, yy=y+4+Math.sin(i*1.5)*1.6; i?g.lineTo(xx,yy):g.moveTo(xx,yy); } g.stroke();
  el(g,x,y-12,14,4.5); g.fillStyle='#F4EEE4'; g.fill(); if(lvl>.05){ el(g,x,y-11,12*Math.min(1,.6+.4*lvl),3.6); g.fillStyle=lvl>1.05?'#9DB06A':'#A9B86E'; g.fill(); } }
function drawCoins(g,x,y,v){ for(let i=0;i<3;i++){ el(g,x+(i-1)*7,y-i*4,13,5); g.fillStyle=i===2?'#F2C94C':'#C9A23A'; g.fill(); g.strokeStyle='#8A6A1F'; g.lineWidth=1; g.stroke(); }
  g.fillStyle='#FFF3C8'; g.font='900 12px "M PLUS Rounded 1c"'; g.textAlign='center'; g.fillText('¥'+v,x,y-18); }
function drawLantern(g,x,y,s,txt){ g.drawImage(glowSpr('rgba(255,150,60,.5)'),x-80*s,y-70*s,160*s,150*s);
  g.fillStyle='#2A1A12'; rr(g,x-12*s,y-34*s,24*s,7*s,2*s); g.fill(); rr(g,x-12*s,y+27*s,24*s,7*s,2*s); g.fill();
  el(g,x,y,25*s,30*s); g.fillStyle=rg(g,x-6*s,y-8*s,2,32*s,[[0,'#FFE3A2'],[.5,'#FF9A3D'],[1,'#D2582A']]); g.fill();
  g.strokeStyle='rgba(150,60,20,.35)'; g.lineWidth=1.4*s; for(let k=-2;k<=2;k++){ const yy=y+k*10*s, half=25*s*Math.sqrt(Math.max(0,1-(k*10/30)**2)); g.beginPath(); g.moveTo(x-half,yy); g.lineTo(x+half,yy); g.stroke(); }
  if(txt){ g.fillStyle='rgba(90,20,10,.8)'; g.font=`900 ${15*s}px "M PLUS Rounded 1c"`; g.textAlign='center'; g.textBaseline='middle'; g.fillText(txt,x,y+1); g.textBaseline='alphabetic'; } }
function drawNoren(g,y0,h,panels){ const w=VW/panels;
  for(let i=0;i<panels;i++){ const x=i*w+2; g.fillStyle=lg(g,0,y0,0,y0+h,[[0,'#B8332A'],[1,'#9C2722']]); rr(g,x,y0-8,w-4,h+8,6); g.fill(); g.fillStyle='rgba(255,255,255,.07)'; g.fillRect(x+4,y0,4,h-6); }
  // the stall's mark on the middle panel: a bowl with steam
  const cx=VW/2+(panels%2?0:w/2)-(panels%2?0:w/2), cy=y0+h*.5; g.strokeStyle='rgba(255,244,226,.9)'; g.lineWidth=3; g.lineCap='round';
  g.beginPath(); g.moveTo(cx-16,cy); g.quadraticCurveTo(cx,cy+18,cx+16,cy); g.closePath(); g.stroke(); for(let k=-1;k<=1;k++){ g.beginPath(); g.moveTo(cx+k*7,cy-6); g.quadraticCurveTo(cx+k*7+4,cy-11,cx+k*7,cy-16); g.stroke(); } }
// a guest: chunky toy figure, dot eyes, blush; mood '', 'happy', 'eat', 'hmm', 'ask'
function drawGuest(g,L,x,y,s,mood,o={}){ g.save(); g.translate(x,y); g.scale(s,s); const bob=o.bob||0; g.translate(0,bob);
  shadow(g,0,6,46,9,.18);
  if(artReady('guest-'+L.id)){ const im=ART['guest-'+L.id], F=FACE[L.id], H=GUEST_H, W=H*im.naturalWidth/im.naturalHeight, top=26-H;
    g.drawImage(im,-W/2,top,W,H);
    const fw=F.w*W; g.translate(-W/2+F.x*W, top+F.t*H+fw*.25); g.scale(fw/74,fw/74); face(g,mood,{t:o.t,seed:L.id.length*.61}); g.restore(); return; }
  // body and arms
  g.fillStyle=lg(g,0,-70,0,10,[[0,L.coat],[1,shade(L.coat,-.25)]]); rr(g,-42,-70,84,90,26); g.fill();
  g.fillStyle='rgba(255,255,255,.12)'; rr(g,-34,-64,20,60,10); g.fill();
  if(mood==='ask'){ g.fillStyle=L.coat; rr(g,26,-118,18,56,9); g.fill(); g.fillStyle=L.skin; el(g,35,-122,10,10); g.fill(); }
  // head
  g.fillStyle=rg(g,-12,-128,6,52,[[0,lighten(L.skin,.12)],[1,shade(L.skin,-.12)]]); el(g,0,-112,46,42); g.fill();
  hair(g,L);
  g.translate(0,-106); face(g,mood,{t:o.t,seed:L.id.length*.61});
  g.restore(); }
const GUEST_H=212;   // a painted guest's height on the stage at scale 1
// the face, drawn around the point between the eyes (units: a face 74 wide), in the owner's target style:
// tall solid dark eyes, soft round cheeks, a small smile, and a wide open laugh when happy; blinks every few seconds
function face(g,mood,o){ const ex=19, blink=((o.t||clock)+(o.seed||0))%3.7<.12, ink='#2A1810';
  for(const sx of [-1,1]){ g.fillStyle=rg(g,sx*30,13,0,12,[[0,'rgba(255,120,120,.55)'],[1,'rgba(255,120,120,0)']]); el(g,sx*30,13,12,8); g.fill(); }
  g.lineCap='round'; g.lineJoin='round'; g.strokeStyle=ink;
  if(mood==='happy' || mood==='eat'){ g.lineWidth=3.6; for(const sx of [-1,1]){ g.beginPath(); g.arc(sx*ex,3,6.5,Math.PI*1.12,Math.PI*1.88); g.stroke(); } }
  else if(blink){ g.lineWidth=3.2; for(const sx of [-1,1]){ g.beginPath(); g.moveTo(sx*ex-5,1); g.quadraticCurveTo(sx*ex,4,sx*ex+5,1); g.stroke(); } }
  else for(const sx of [-1,1]){ const x=sx*ex; g.fillStyle=ink; el(g,x,0,6.2,8.4); g.fill(); }
  if(mood==='hmm'){ g.lineWidth=2.6; g.beginPath(); g.moveTo(-23,-14); g.lineTo(-12,-11); g.moveTo(23,-14); g.lineTo(12,-11); g.stroke(); }
  // the mouth
  if(mood==='happy'){ g.beginPath(); g.moveTo(-9,13); g.quadraticCurveTo(0,14.5,9,13); g.quadraticCurveTo(8,26,0,26); g.quadraticCurveTo(-8,26,-9,13); g.closePath();
    g.fillStyle='#7A2418'; g.fill(); g.save(); g.clip(); g.fillStyle='#F07C7C'; el(g,0,25,6,4.5); g.fill(); g.restore(); g.lineWidth=1.6; g.stroke(); }
  else if(mood==='eat'){ const k=Math.abs(Math.sin((o.t||0)*14))*3; el(g,0,17,4.5,2.6+k); g.fillStyle='#7A2418'; g.fill(); }
  else if(mood==='hmm'){ g.lineWidth=2.4; g.beginPath(); g.moveTo(-6,18); g.quadraticCurveTo(-2,15,0,17); g.quadraticCurveTo(2,19,6,16); g.stroke(); }
  else { g.lineWidth=2.4; g.beginPath(); g.moveTo(-5,15); g.quadraticCurveTo(-2.5,18.5,0,15.5); g.quadraticCurveTo(2.5,18.5,5,15); g.stroke(); } }
function hair(g,L){ g.fillStyle=L.hair; const dark=shade(L.hair,-.3);
  if(L.style==='cap'){ g.fillStyle='#3E4A78'; g.beginPath(); g.ellipse(0,-130,44,30,0,Math.PI,TAU); g.fill(); g.fillStyle='#2E3860'; rr(g,-46,-134,92,10,5); g.fill(); g.fillStyle='#4E5A8A'; el(g,0,-158,6,4); g.fill(); g.fillStyle=L.hair; g.beginPath(); g.moveTo(-40,-124); g.lineTo(-30,-112); g.lineTo(-24,-124); g.lineTo(-14,-114); g.lineTo(-8,-124); g.closePath(); g.fill(); return; }
  // faceted hair: a cap of flat polygons in two tones (the toy look)
  g.beginPath(); g.moveTo(-47,-108); g.lineTo(-44,-136); g.lineTo(-24,-156); g.lineTo(6,-160); g.lineTo(32,-150); g.lineTo(46,-128); g.lineTo(47,-108); g.lineTo(34,-122); g.lineTo(18,-112); g.lineTo(10,-126); g.lineTo(-6,-114); g.lineTo(-16,-126); g.lineTo(-30,-112); g.closePath(); g.fill();
  g.fillStyle=dark; g.beginPath(); g.moveTo(6,-160); g.lineTo(32,-150); g.lineTo(46,-128); g.lineTo(30,-136); g.lineTo(14,-146); g.closePath(); g.fill();
  if(L.style==='pony'){ g.fillStyle=L.hair; el(g,0,-166,16,13); g.fill(); g.fillStyle='#D8342B'; g.beginPath(); g.moveTo(-14,-160); g.lineTo(-28,-170); g.lineTo(-26,-152); g.closePath(); g.fill(); g.beginPath(); g.moveTo(14,-160); g.lineTo(28,-170); g.lineTo(26,-152); g.closePath(); g.fill(); el(g,0,-160,6,5); g.fill(); }
  if(L.style==='bob'){ g.fillStyle=L.hair; rr(g,-50,-122,14,40,7); g.fill(); rr(g,36,-122,14,40,7); g.fill(); }
  if(L.style==='long'){ g.fillStyle=L.hair; rr(g,-50,-122,14,70,7); g.fill(); rr(g,36,-122,14,70,7); g.fill(); }
  if(L.style==='spiky'){ g.fillStyle=L.hair; for(let i=-2;i<=2;i++){ g.beginPath(); g.moveTo(i*16-9,-150); g.lineTo(i*16,-172+Math.abs(i)*4); g.lineTo(i*16+9,-150); g.closePath(); g.fill(); } } }
function shade(hex,k){ const n=parseInt(hex.slice(1),16); let r=n>>16, gg=n>>8&255, b=n&255; const f=v=>Math.round(clamp(v*(1+k),0,255)); return `rgb(${f(r)},${f(gg)},${f(b)})`; }
function lighten(hex,k){ const n=parseInt(hex.slice(1),16); let r=n>>16, gg=n>>8&255, b=n&255; const f=v=>Math.round(v+(255-v)*k); return `rgb(${f(r)},${f(gg)},${f(b)})`; }

const seatX=n=>n===1?[560]:[470,700];

// ---------- the night: state ----------
// MODE 'bot' | 'net'; ROLE 'cook' | 'counter'. The counter's phone runs the guests and the night; the cook's phone runs the kitchen.
let MODE='', ROLE='', NIGHT=null, PAUSED=false, clock=0;
const NET_={ch:null};
let K=null, C=null;
const meCook=()=>ROLE==='cook', meCounter=()=>ROLE==='counter';
const kitchenHere=()=>ROLE==='cook' || MODE==='bot', counterHere=()=>ROLE==='counter' || MODE==='bot';
let BID=0, CID=0;
const newBowl=()=>({id:++BID, noodles:null, broth:0, tops:[], pop:1});
const isEmpty=b=>!b.noodles && b.broth<.02 && !b.tops.length;
function kReset(){ K={ basket:{st:'hook', t:0, done:'raw'}, slots:[newBowl(), newBowl()], refill:[0,0], tickets:[], back:[], slid:[], ladleHeld:false, trays:{}, shown:{} }; }
function cReset(n){ const N=NIGHTS[n-1], xs=seatX(N.seats); C={ n, queue:[], seats:xs.map((x,i)=>({i, x, g:null, bowl:null, coins:0, dirty:0, cup:0})), pass:[], next:0, spawnT:1.6, served:0, left:0, earned:0, words:{}, quality:0, done:false, last:null }; }
function trayOpen(w){ if(!NIGHT) return false; const N=NIGHTS[NIGHT.n-1]; return N.words.includes(w) || (K && K.trays[w]); }

// ---------- one message to the other station: on this phone (しばBot) or across the link ----------
function toCook(m){ if(ROLE==='cook' || MODE==='bot') kRecv(m); if(MODE==='net' && ROLE==='counter') netSend(m); }
function toCounter(m){ if(ROLE==='counter' || MODE==='bot') cRecv(m); if(MODE==='net' && ROLE==='cook') netSend(m); }
// in practice, しばBot hears every message for its station
function botHear(m){ if(MODE!=='bot') return; if(ROLE==='counter') botCookHear(m); }

// ---------- the kitchen: the cook's station ----------
function doneOf(t){ return t<3.5?'raw':t<12?'ready':t<16?'soft':'soggy'; }
function kRecv(m){ if(!K) return;
  if(m.t==='order'){ if(!K.tickets.some(t=>t.cid===m.cid)){ K.tickets.push({cid:m.cid, o:null, who:m.who, done:false, at:clock}); SFX.pop(); } return; }
  if(m.t==='ticket'){ let t=K.tickets.find(t=>t.cid===m.cid); if(!t){ t={cid:m.cid, o:null, who:m.who, done:false, at:clock}; K.tickets.push(t); } if(!t.o){ t.o=m.o.slice(); SFX.ding(); } botHear(m); return; }
  if(m.t==='result'){ const t=K.tickets.find(t=>t.cid===m.cid); if(t){ t.done=!!m.ok; t.ok=m.ok; t.why=m.why; } if(m.ok && meCook()) toast(T('They loved it!','客人很喜欢！'),'ok'); botHear(m); return; }
  if(m.t==='back'){ if(!K.back.some(b=>b.id===m.bowl.id)){ K.back.push(Object.assign(m.bowl,{why:m.why, o:m.o, cid:m.cid})); if(meCook()){ SFX.hmm(); toast(T('A bowl came back','有一碗被退回来了'),'bad'); } } botHear(m); return; }
  if(m.t==='guest'){ K.cur={cid:m.cid, teach:m.teach, who:m.who}; if(m.nw){ K.trays[m.nw]=1; newWord(m.nw); } return; } }
function kitchenTick(dt){ const b=K.basket; if(b.st==='pot'){ b.t+=dt; const d=doneOf(b.t); if(d!==b.done){ b.done=d; if(d==='ready') SFX.tick(); } }
  for(let i=0;i<2;i++){ if(!K.slots[i]){ K.refill[i]-=dt; if(K.refill[i]<=0){ K.slots[i]=newBowl(); } } else if(K.slots[i].pop>0) K.slots[i].pop=Math.max(0,K.slots[i].pop-dt*4); }
  K.slid=K.slid.filter(s=>(s.t+=dt)<.45);
  K.tickets=K.tickets.filter(t=>!(t.done && clock-t.at>0 && (t.doneAt=t.doneAt||clock) && clock-t.doneAt>2.5));
  if(meCook() && BOIL && AC) try{ BOIL.gain.setTargetAtTime(b.st==='pot'?.09:.03, AC.currentTime, .3); }catch(e){} }
// the cook's actions (each one checks it still makes sense, so a double tap or a late drop does nothing twice)
function kNest(){ if(K.basket.st!=='hook') return false; K.basket.st='full'; K.basket.t=0; K.basket.done='raw'; SFX.land(); noteAct(); return true; }
function kLower(){ if(K.basket.st!=='full') return false; K.basket.st='pot'; K.basket.t=0; K.basket.done='raw'; SFX.plop(); splash(KL.pot.x,KL.pot.y); noteAct(); return true; }
function kLift(i){ const bw=K.slots[i]; if(K.basket.st!=='pot' || !bw || bw.noodles) return false; bw.noodles=K.basket.done; bw.pop=1; K.basket.st='hook'; K.basket.t=0; SFX.plop(); drips(KL.slots[i].x,KL.slots[i].y); noteAct(); return true; }
function kPour(i,dt){ const bw=K.slots[i]; if(!bw) return false; const before=bw.broth; bw.broth=Math.min(1.12,bw.broth+dt*.45); if(bw.broth>1.04 && Math.random()<dt*8) PT.push({k:'drop',x:KL.slots[i].x+rnd(-50,50),y:KL.slots[i].y,vx:rnd(-30,30),vy:rnd(-60,-20),g:400,life:0,max:.5,c:'rgba(176,106,46,.9)',size:2.4});
  if(before<.7 && bw.broth>=.7) SFX.tick(); return true; }
function kTop(i,w){ const bw=K.slots[i]; if(!bw || bw.tops.includes(w) || !trayOpen(w)) return false; bw.tops.push(w); bw.pop=1; SFX.land(); const p=bowlTopAt(KL.slots[i].x,KL.slots[i].y,1,w); sparkle(p.x,p.y,4); noteAct(); return true; }
function kUntop(i,w){ const bw=K.slots[i]; if(!bw || !bw.tops.includes(w)) return false; bw.tops=bw.tops.filter(x=>x!==w); SFX.grab(); noteAct(); return true; }
function kDump(i){ const bw=K.slots[i]; if(!bw || isEmpty(bw)) return false; K.slots[i]=newBowl(); SFX.splash(); noteAct(); return true; }
function kSlide(i){ const bw=K.slots[i]; if(!bw || isEmpty(bw)) return false; K.slots[i]=null; K.refill[i]=.6; K.slid.push({bowl:bw, x:KL.slots[i].x, y:KL.slots[i].y, t:0}); SFX.slide(); buzz(10);
  toCounter({t:'bowl', bowl:{id:bw.id, noodles:bw.noodles, broth:+bw.broth.toFixed(2), tops:bw.tops.slice()}}); noteAct(); return true; }
function kTakeBack(j,i){ const r=K.back[j]; if(!r || (K.slots[i] && !isEmpty(K.slots[i]))) return false; K.back.splice(j,1); K.slots[i]={id:r.id, noodles:r.noodles, broth:r.broth, tops:r.tops.slice(), pop:1, why:r.why, o:r.o}; SFX.land(); noteAct(); return true; }

// ---------- the counter: guests, orders, tea, serving, clearing ----------
const NOW_GUEST=()=>NIGHTS[C.n-1].guests;
function spawnGuest(){ const N=NIGHTS[C.n-1]; if(C.next>=N.guests.length) return; const spec=N.guests[C.next++], id=++CID;
  C.queue.push({id, who:spec.who, o:spec.o.slice(), teach:spec.teach, nw:spec.nw||null, wait:0, x:CL.queue[C.queue.length%3].x+60, idx:C.next}); SFX.bell(); }
const seated=s=>!!s.g && s.g.st!=='leave';
const freeSeat=()=>C.seats.findIndex(s=>!seated(s) && !s.bowl && !s.coins && !s.dirty);
function cSeat(gid, si){ const qi=C.queue.findIndex(q=>q.id===gid), s=C.seats[si]; if(qi<0 || !s || seated(s) || s.bowl || s.coins || s.dirty) return false;
  if(seated(s)) return false; const q=C.queue.splice(qi,1)[0]; s.g={id:q.id, who:q.who, o:q.o, teach:q.teach, nw:q.nw, st:'walk', t:0, pat:1, tea:false, sent:false, idx:q.idx, from:q.x}; s.cup=0;
  SFX.pop(); noteAct(); toCook({t:'guest', cid:q.id, teach:q.teach, who:q.who, nw:q.nw}); if(q.nw) newWord(q.nw); return true; }
function cTake(si){ const s=C.seats[si], g=s&&s.g; if(!g || g.st!=='ask') return false; g.st='order'; g.t=0; SFX.ding(); noteAct(); toCook({t:'order', cid:g.id, who:g.who}); return true; }
function cSend(si){ const s=C.seats[si], g=s&&s.g; if(!g || (g.st!=='order' && g.st!=='refused') || g.sent) return false; g.sent=true; SFX.slide(); noteAct(); toCook({t:'ticket', cid:g.id, o:g.o, who:g.who}); return true; }
function cTea(si,dt){ const s=C.seats[si], g=s&&s.g; if(!g || g.st==='leave' || g.st==='walk') return false; s.cup=Math.min(1.15,s.cup+dt*.7);
  if(s.cup>=.9 && !g.tea){ g.tea=true; g.pat=Math.min(1.25,g.pat+.25); g.happyT=1.2; SFX.happy(); noteAct(); } return true; }
function judge(b,o){ if(!b.noodles) return {ok:false, why:'noodles'}; if(b.noodles==='raw') return {ok:false, why:'raw'}; if(b.broth<.5) return {ok:false, why:'broth'};
  const miss=o.filter(x=>!b.tops.includes(x)), extra=b.tops.filter(x=>!o.includes(x)); if(miss.length||extra.length) return {ok:false, why:'tops', miss, extra};
  return {ok:true, q:(b.noodles==='ready'?1:.6)*(b.broth>=.7 && b.broth<=1.06?1:.8)}; }

// ---------- input: drag, hold, pour, rub, tap ----------
const PTR={x:VW/2,y:VH/2};
function kDown(p){ const b=K.basket;
  for(let j=0;j<K.back.length;j++){ if(dist(p,{x:KL.pass.x-30+j*60,y:KL.pass.y+8})<46) return {kind:'back', back:j}; }
  // toppings already in a bowl can be picked off again
  for(let i=0;i<2;i++){ const bw=K.slots[i]; if(!bw) continue; for(const w of bw.tops){ const q=bowlTopAt(KL.slots[i].x,KL.slots[i].y,1,w); if(dist(p,q)<18 && p.y<KL.slots[i].y+8) return {kind:'untop', i, w}; } }
  if(b.st==='pot' && dist(p,{x:KL.pot.x+30,y:KL.pot.y-30})<70) return {kind:'basket', from:'pot'};
  if(b.st!=='pot' && dist(p,{x:KL.hook.x+10,y:KL.hook.y})<52) return {kind:'basket', from:'hook'};
  if(dist(p,{x:KL.box.x,y:KL.box.y})<64) return {kind:'nest'};
  if(dist(p,{x:KL.ladle.x-10,y:KL.ladle.y-10})<50 || dist(p,{x:KL.broth.x,y:KL.broth.y})<56) return {kind:'ladle'};
  for(const w of Object.keys(KL.trays)){ const t=KL.trays[w]; if(Math.abs(p.x-t.x)<58 && Math.abs(p.y-t.y)<34 && trayOpen(w)){ K.shown[w]=1; return {kind:'top', w}; } }
  for(let i=0;i<2;i++){ const s=KL.slots[i], bw=K.slots[i]; if(bw && !isEmpty(bw) && Math.abs(p.x-s.x)<66 && p.y>s.y-30 && p.y<s.y+52) return {kind:'bowl', i}; }
  return null; }
const slotAt=q=>KL.slots.findIndex(s=>Math.abs(q.x-s.x)<72 && q.y>s.y-46 && q.y<s.y+56);
function kMove(it){ if(it.kind==='ladle'){ const q={x:it.x, y:it.y-LIFT}, i=slotAt({x:q.x-6,y:q.y+30}); it.over=i>=0 && K.slots[i] ? i : null; } }
function kDrop(it,p){ const q={x:p.x, y:p.y-LIFT};
  if(it.kind==='nest'){ if(dist(q,KL.hook)<64 || dist(q,{x:KL.hook.x,y:KL.hook.y+20})<64) kNest(); return; }
  if(it.kind==='basket'){ if(it.from==='hook'){ if(dist(q,KL.pot)<120) kLower(); return; } const i=slotAt(q); if(i>=0) kLift(i); return; }
  if(it.kind==='top'){ const i=slotAt(q); if(i>=0) kTop(i,it.w); return; }
  if(it.kind==='untop'){ const i=slotAt(q); if(i!==it.i) kUntop(it.i,it.w); return; }
  if(it.kind==='bowl'){ if(q.x>820 && q.y>220) kSlide(it.i); else if(dist(q,KL.scrap)<60) kDump(it.i); return; }
  if(it.kind==='back'){ const i=slotAt(q); if(i>=0) kTakeBack(it.back,i); return; } }
function cDown(p){
  for(const s of C.seats){ if(s.coins && dist(p,{x:s.x+92,y:384})<38) return {kind:'tap', fn:()=>cCollect(s.i)}; }
  for(const s of C.seats){ const g=s.g; if(g && g.st==='ask' && Math.abs(p.x-s.x)<110 && p.y>80 && p.y<320) return {kind:'tap', fn:()=>cTake(s.i)}; }
  for(const s of C.seats){ if(s.bowl && s.bowl.refused && dist(p,{x:s.x,y:372})<56) return {kind:'refused', si:s.i}; if(s.bowl && s.bowl.empty && dist(p,{x:s.x,y:372})<56) return {kind:'dish', si:s.i}; }
  for(let j=0;j<C.pass.length;j++){ const P=CL.pass[j%2]; if(dist(p,{x:P.x,y:P.y+(j>1?-14:0)+8})<50) return {kind:'pbowl', id:C.pass[j].id}; }
  for(const q of C.queue){ if(Math.abs(p.x-q.x)<40 && p.y>170 && p.y<300) return {kind:'guest', id:q.id}; }
  if(dist(p,CL.teapot)<46) return {kind:'teapot'};
  if(dist(p,CL.cloth)<40) return {kind:'cloth'};
  return null; }
const seatAtX=x=>C.seats.reduce((bi,s,i)=>Math.abs(s.x-x)<Math.abs(C.seats[bi].x-x)?i:bi,0);
function cMove(it,dt){ const q={x:it.x, y:it.y-LIFT};
  if(it.kind==='teapot'){ const si=seatAtX(q.x), s=C.seats[si]; it.over=(s.g && s.g.st!=='walk' && s.g.st!=='leave' && Math.abs(q.x+40-cupX(s))<60 && q.y>CUPY-140 && q.y<CUPY+20) ? si : null; }
  if(it.kind==='cloth'){ const n=it.path.length; if(n>1){ const a=it.path[n-2], b=it.path[n-1]; const si=seatAtX(b.x), s=C.seats[si]; if(s.dirty && Math.abs(b.x-s.x)<80 && b.y>360 && b.y<440){ cWipe(si,Math.hypot(b.x-a.x,b.y-a.y)/260); if(Math.random()<.3) SFX.wipe(); } } } }
function cDrop(it,p){ const q={x:p.x, y:p.y-LIFT};
  if(it.kind==='guest'){ const si=C.seats.findIndex(s=>Math.abs(q.x-s.x)<120 && q.y>110 && q.y<380); if(si>=0) cSeat(it.id,si); return; }
  if(it.kind==='pbowl'){ const si=C.seats.findIndex(s=>Math.abs(q.x-s.x)<110 && q.y>150 && q.y<450); const pi=C.pass.findIndex(b=>b.id===it.id); if(si>=0 && pi>=0) cServe(pi,si); return; }
  if(it.kind==='refused'){ if(q.x<280 && q.y<380) cReturn(it.si); return; }
  if(it.kind==='dish'){ if(dist(q,CL.tub)<80) cClear(it.si); return; } }

// ---------- online: the hub's channel inside 夜ふかし, our own link otherwise ----------
function netSend(m){ const ch=NET_.ch; if(ch) ch.send(m, true); }
function onNet(m){ if(!m) return;
  if(m.t==='role'){ if(LINK.side==='g'){ ROLE=m.role==='cook'?'counter':'cook'; RD.me=false; RD.them=false; RD.n=m.n||1; readyUI(); } return; }
  if(m.t==='ready'){ RD.them=true; if(m.n) RD.n=m.n; if(!NIGHT || NIGHT.ph!=='run') readyUI(); maybeGo(); return; }
  if(m.t==='night'){ RD.n=m.n; if(!NIGHT || NIGHT.ph!=='run') readyUI(); return; }
  if(m.t==='go'){ RD.n=m.n; startNight(m.n); return; }
  if(m.t==='close'){ if(meCook()) showClose(m.sum); return; }
  if(m.t==='swap'){ ROLE=ROLE==='cook'?'counter':'cook'; toReady(); return; }
  if(m.t==='again'){ RD.n=m.n; toReady(); return; }
  if(!NIGHT || NIGHT.ph!=='run') return;
  if(meCook()) kRecv(m); else cRecv(m); }

  if(a==='pcook'||a==='pcounter'){ MODE='bot'; ROLE=a==='pcook'?'cook':'counter'; RD.n=store.get('night2',0)?RD.n:1; RD.me=false; RD.them=true; readyUI(); return; }
  if(a==='create') return ui(`<div class="kicker">${T('Open a room','开房间')}</div><h2>${T('Which role do you take first?','你先当哪个角色？')}</h2>${ROLE_CARDS('h')}<div class="row"><button class="btn ghost" data-a="lobby">${T('Back','返回')}</button></div>`);
  if(a==='hcook'||a==='hcounter'){ ROLE=a==='hcook'?'cook':'counter'; MODE='net'; RD.n=1; LINK.open(onNet, linkState); NET_.ch=LINK; LINK.host(); roomUI('opening'); return; }
  if(a==='join'){ const code=($('#codeIn').value||'').trim().toUpperCase(); if(!/^[A-Z0-9]{4}$/.test(code)) return lobbyUI(T('Type the 4-character room code.','请输入 4 位房间码。')); joinRoom(code); return; }
  if(a==='rejoin'){ const s=LINK.saved(); if(!s) return lobbyUI(); MODE='net'; LINK.open(onNet, linkState); NET_.ch=LINK; if(s.side==='h'){ ROLE=store.get('hostRole','cook'); LINK.host(s.code,true); roomUI('opening'); } else { LINK.join(s.code,true); roomUI('joining'); } return; }
  if(a==='share'){ const url=LINK.invite(); try{ if(navigator.share){ await navigator.share({title:'まよなか屋', text:T(`Cook ramen with me · room ${LINK.code}`,`一起开拉面摊 · 房间 ${LINK.code}`), url}); return; } }catch(x){ if(x && x.name==='AbortError') return; } }
  if(a==='share' || a==='copy'){ try{ await navigator.clipboard.writeText(LINK.invite()); toastUI(T('Link copied','已复制链接')); }catch(x){ toastUI(T('Select the link and copy it','请选中链接复制')); } return; }
  if(a==='leave'){ LINK.leave(false); lobbyUI(); return; }
  if(a==='lobby'){ lobbyUI(); return; }
  if(a==='ready'){ if(RD.me) return; RD.me=true; if(MODE==='bot'){ startNight(RD.n); return; } netSend({t:'ready', n:meCounter()?RD.n:0}); readyUI(); maybeGo(); return; }
  if(a==='bagain'){ toReady(); return; } if(a==='bnext'){ RD.n=Math.min(NIGHTS.length,(NIGHT?NIGHT.n:1)+1); toReady(); return; } if(a==='bswap'){ ROLE=ROLE==='cook'?'counter':'cook'; toReady(); return; }
  if(a==='nagain'){ netSend({t:'again', n:NIGHT?NIGHT.n:1}); RD.n=NIGHT?NIGHT.n:1; toReady(); return; }
  if(a==='nnext'){ const n=Math.min(NIGHTS.length,(NIGHT?NIGHT.n:1)+1); netSend({t:'again', n}); RD.n=n; toReady(); return; }
  if(a==='nswap'){ netSend({t:'swap'}); ROLE=ROLE==='cook'?'counter':'cook'; toReady(); return; }
  if(a==='hnext') return HUB.next(); if(a==='hagain') return HUB.again(); if(a==='hswap') return HUB.swapAgain(); if(a==='hmenu') return HUB.menu(); });
function joinRoom(code){ MODE='net'; LINK.open(onNet, linkState); NET_.ch=LINK; LINK.join(code); roomUI('joining'); }
function toastUI(t){ toast(t); $('#status').hidden=false; }
// the host remembers its role, so a reload can rejoin as the same one
setInterval(()=>{ if(MODE==='net' && LINK.side==='h' && ROLE) store.set('hostRole',ROLE); }, 2000);

// ---------- main loop ----------
let last=0;
function frame(now){ requestAnimationFrame(frame); let dt=last?Math.min(.05,(now-last)/1000):.016; last=now; if(PAUSED) dt=0; clock+=dt;
  if(NIGHT && NIGHT.ph==='run'){ NIGHT.t+=dt; if(kitchenHere()) kitchenTick(dt); if(counterHere()) counterTick(dt); holdTick(dt);
    if(MODE==='bot'){ if(ROLE==='cook') botCounter(dt); else botCook(dt); } }
  stepParticles(dt);
  ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle='#1A2340'; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(S*DPR,0,0,S*DPR,OX*DPR,OY*DPR); ctx.save(); ctx.beginPath(); ctx.rect(0,0,VW,VH); ctx.clip();
  if(NIGHT && K && C){ if(meCook()) drawKitchen(dt); else drawCounter(dt); if(NIGHT.ph==='run') drawHintArrow(ctx,HINT); }
  else { if(!C) cReset(1); if(!K) kReset(); drawCounter(dt); }
  drawParticles(ctx); ctx.restore();
  hintTick(); domTick(); hudTick(); }
function hudTick(){ if(!NIGHT || !C) return; const y='¥'+C.earned.toLocaleString('ja-JP'), el_=$('#yen'); if(meCounter()){ if(el_.dataset.k!==y){ el_.dataset.k=y; el_.innerHTML=`<b>${y}</b>`; } el_.hidden=false; } else el_.hidden=true;
  const N=NIGHTS[(NIGHT.n||1)-1], tot=N.guests.length, k=meCounter()?C.served+':'+C.next+':'+C.left:'c', pr=$('#prog');
  if(meCounter()){ if(pr.dataset.k!==k){ pr.dataset.k=k; pr.innerHTML=`${esc(T(N.name[0],N.name[1]))} · ${Array.from({length:tot},(_,i)=>`<i class="${i<C.served+C.left?'on':i<C.next?'now':''}"></i>`).join('')}`; } pr.hidden=false; } else pr.hidden=true; }
requestAnimationFrame(frame);
$('#rot').textContent=T('Turn your phone sideways','请把手机横过来')+' · 横にしてね';
function applySafe(){ if(!HUB) return; const s=HUB.safe(), r=document.documentElement.style; r.setProperty('--sl',s.l+'px'); r.setProperty('--sr',s.r+'px'); r.setProperty('--st',s.t+'px'); r.setProperty('--sb',s.b+'px'); }
if(HUB){ MODE='net'; ROLE=HUB.role(); NET_.ch=HUB.open(onNet, setLinkHub); applySafe(); RD.n=store.get('night2',0)?2:1; readyUI(); }
else { const inv=(location.hash.match(/join=([A-Za-z0-9]{4})/)||[])[1]; if(inv){ history.replaceState(null,'',location.pathname); joinRoom(inv.toUpperCase()); } else lobbyUI(); }
function setLinkHub(up){ setLink(up); }
window.__mr={ role:()=>ROLE, mode:()=>MODE, K:()=>K, C:()=>C, N:()=>NIGHT, KL, CL, RD, HINT:()=>HINT, scr:(x,y)=>toS(x,y), link:()=>LINK, seatX:()=>C?C.seats.map(s=>s.x):[],
  act:{kNest, kLower, kLift, kTop, kUntop, kSlide, kDump, kTakeBack, cSeat, cTake, cSend, cServe, cReturn, cCollect, cClear, cWipe, cTea}, toCounter, toCook, judge, words:()=>MASTER, bank:()=>BANK };
})();
</script>
